name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Armar la carpeta a publicar
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'README.md' --exclude '_site' ./ _site/

      - name: Preparar el artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
